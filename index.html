html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
/* ---------- views ---------- */
.view{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg);
  padding:calc(var(--safe-top) + 8px) 16px calc(var(--safe-bot) + 108px);
  transition:transform .42s var(--ease),opacity .3s ease,filter .42s var(--ease);will-change:transform}
.view.tab{opacity:0;pointer-events:none;transform:translateY(10px)}
.view.tab.active{opacity:1;pointer-events:auto;transform:none}
.view.tab.active.pushed{transform:translateX(-24%);filter:brightness(.55)}
#detail{z-index:10;padding:0 0 calc(var(--safe-bot) + 108px);transform:translateX(102%);box-shadow:-20px 0 40px rgba(0,0,0,.6)}
#detail.open{transform:none}
#detail.dragging{transition:none}
.wrap{max-width:560px;margin:0 auto}
/* ---------- top / brand ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;margin-bottom:6px}
.kngLogo{height:30px;width:auto;display:block}
.asof{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3}
.h-title{font-family:var(--head);font-size:26px;font-weight:700;letter-spacing:-.4px;margin:4px 0 14px}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.banner{display:flex;gap:10px;align-items:center;background:rgba(255,198,0,.09);border:1px solid rgba(255,198,0,.35);
  color:#ffe08a;border-radius:14px;padding:11px 12px;font-size:13.5px;line-height:1.35;margin:4px 0 14px}
.banner .tag{flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.6px;background:#ffc600;color:#111;border-radius:6px;padding:3px 6px}
.banner button{margin-left:auto;flex:0 0 auto;background:rgba(255,198,0,.16);border:0;color:#ffd24d;font-weight:700;border-radius:10px;min-height:36px;padding:0 12px}
/* ---------- hero ---------- */
.hero{font-family:var(--head);font-size:44px;font-weight:600;letter-spacing:-1.2px;line-height:1.08;margin:4px 0 2px}
.hero.neg{color:var(--red)}
.chg{font-size:16px;font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.chg .when{color:var(--muted);font-weight:500;font-size:14px}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}
.sub{font-size:13px;color:var(--muted);margin-top:6px}
/* ---------- chart ---------- */
.chart{position:relative;margin:14px -16px 0;height:210px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.chart .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s var(--ease) forwards}
.chart .fade{opacity:0;animation:fadeIn .7s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
.pill{font:600 11px var(--body);}
.tip{position:absolute;top:-2px;transform:translateX(-50%);background:#fff;color:#000;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.ranges{display:flex;align-items:center;gap:4px;background:#121418;border:1px solid var(--line);border-radius:999px;padding:4px;margin:10px 0 0}
.ranges button{flex:1;min-height:36px;border:0;background:transparent;border-radius:999px;color:#c9cfd6;font-weight:700;font-size:13px;transition:background .25s,color .25s}
.ranges button.on{background:var(--brand);color:var(--brand-ink,#111)}
.rangeNote{font-size:13px;color:var(--muted);margin:8px 2px 0;min-height:18px}
/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.cardHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.cardHead .label{font-size:12.5px}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.5px;color:#ffd24d;border:1px solid rgba(255,198,0,.45);border-radius:6px;padding:2px 6px}
.statsTwo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.tile .v{font-family:var(--head);font-size:21px;font-weight:600;margin-top:4px;letter-spacing:-.3px}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.goal .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.goal .pct{font-family:var(--head);font-size:20px;font-weight:600}
.bar{position:relative;height:10px;border-radius:999px;background:#23272e;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--kng2),var(--kng));width:0;transition:width .9s var(--ease)}
.bar.brand i{background:linear-gradient(90deg,var(--brand),var(--brand-l))}
.barLbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}
/* range bar (12-month low/high) */
.rbar{margin:2px 0 16px}
.rbar .lbls{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.rbar .lbls span:nth-child(2){color:var(--muted)}
.rbar .track{position:relative;height:6px;border-radius:9px;background:#2a2f37}
.rbar .mark{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,255,255,.12);transition:left .8s var(--ease)}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
.grid2 .cell{padding:11px 0;border-bottom:1px dashed #2a2f37}
.grid2 .k{font-size:14px;color:#c3c9d0}
.grid2 .v{font-size:16px;font-weight:700;margin-top:3px}
/* breakdown (the loved part) */
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}

.row.total{border-top:1px solid #3a4250}
.row.total .k{color:var(--text);font-weight:600} .row.total .v{font-size:18px}
.row.mine{background:rgba(34,196,126,.09);margin:6px -10px 0;padding:14px 10px;border-radius:12px;border-bottom:0}
.row.mine .k{color:var(--text);font-weight:600} .row.mine .v{color:var(--green);font-size:21px;font-family:var(--head)}
/* company cards */
.co{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;transition:transform .15s,background .2s;position:relative;overflow:hidden}
.co:active{transform:scale(.985);background:var(--card2)}
.co::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cb,#555)}
.co .r1{display:flex;align-items:center;gap:12px}
.logoTile{flex:0 0 auto;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logoTile img{max-width:100%;max-height:100%;display:block}
.co .logoTile{width:78px;height:46px;padding:5px 7px}
.co .nm{flex:1;min-width:0}
.co .nm b{display:block;font-family:var(--head);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co .nm > span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.co .val{text-align:right}
.co .val b{display:block;font-size:17px;font-weight:700}
.chip{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:700;border-radius:7px;padding:3px 7px;min-width:62px;text-align:center}
.chip.up{background:rgba(34,196,126,.15)} .chip.down{background:rgba(255,84,104,.15)} .chip.flat{background:#22262d}

.co .r2 .mine{font-size:12.5px;color:var(--muted)} .co .r2 .mine b{color:var(--text);font-weight:600}
.spark{display:block}
.smallTag{display:inline-block!important;font-size:10px;font-weight:800;color:#ffd24d;border:1px solid rgba(255,198,0,.4);border-radius:5px;padding:1px 4px;margin-left:6px;vertical-align:2px}
/* allocation */
.alloc{display:flex;height:14px;border-radius:999px;overflow:hidden;background:#23272e;gap:2px}
.alloc i{display:block;height:100%;transition:flex-grow .8s var(--ease)}
.legend{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.legend .li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}

/* list rows (companies tab) */
.lrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;text-align:left;min-height:64px}
.lrow:last-child{border-bottom:0}
.lrow .logoTile{width:54px;height:36px;padding:4px 5px;border-radius:9px}
.lrow .nm{flex:1;min-width:0} .lrow .nm b{display:block;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .lrow .nm > span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .val{text-align:right} .lrow .val b{display:block;font-weight:700}
.chev{color:var(--dim);font-size:20px;margin-left:2px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;border:0;font-size:16.5px;font-weight:700;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.kng{background:linear-gradient(90deg,var(--kng2),var(--kng));color:#111}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line2)}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(255,84,104,.45)}
.stack>*+*{margin-top:10px}
.circleBtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:rgba(30,33,38,.8);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.circleBtn svg{width:20px;height:20px}
.circleBtn:active{transform:scale(.94)}
/* detail */
.dtop{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.82);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);
  padding:calc(var(--safe-top) + 8px) 16px 0;border-bottom:1px solid #15181c}
.dtop .r{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px}
.dtitle{flex:1;text-align:center;min-width:0;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
.dtitle.on{opacity:1;transform:none}
.dtitle b{display:block;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtitle span{font-size:17px;font-weight:700}
.subtabs{display:flex;gap:26px;position:relative;margin-top:4px}
.subtabs button{background:none;border:0;padding:10px 0 12px;font-size:16px;font-weight:600;color:#d9dee4;transition:color .25s}
.subtabs button.on{color:var(--brand-l)}
.subtabs .ink{position:absolute;bottom:-1px;height:3px;border-radius:3px;background:var(--brand-l);transition:left .35s var(--ease),width .35s var(--ease)}
.dbody{padding:0 16px}
.brandHead{position:relative;margin:0 -16px;padding:18px 16px 4px;background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--brand) 38%,transparent),transparent 70%)}
.brandHead .r{display:flex;align-items:center;gap:14px}
.brandHead .logoTile{width:104px;height:58px;padding:7px 10px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.brandHead h1{font-family:var(--head);font-size:22px;font-weight:700;margin:0;letter-spacing:-.3px;line-height:1.15}
.brandHead .meta{font-size:12.5px;color:#c0c7cf;margin-top:3px}
.brandHead .meta a{color:var(--brand-l);text-decoration:none;font-weight:600}
.pane{animation:paneIn .38s var(--ease)}
.pane.fromRight{animation-name:paneInR} .pane.fromLeft{animation-name:paneInL}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes paneInR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes paneInL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.seg{display:inline-flex;background:#121418;border:1px solid var(--line2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:34px;padding:0 16px;font-weight:600;color:#c9cfd6;font-size:14px;transition:background .25s,color .25s}
.seg button.on{background:color-mix(in srgb,var(--brand) 70%,#000);color:#fff}
.bars svg{display:block;width:100%;overflow:visible}
.bars rect{transform-origin:bottom;transform-box:fill-box;animation:grow .7s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.lg{display:flex;gap:18px;font-size:14px;margin-top:10px;color:#d6dbe1}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table.q{width:100%;border-collapse:collapse;font-size:14.5px}
table.q th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;text-align:right;font-weight:600;padding:0 0 8px}
table.q th:first-child,table.q td:first-child{text-align:left}
table.q td{text-align:right;padding:10px 0;border-top:1px solid var(--line)}
.hist .hi{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist .hi:last-child{border-bottom:0}
.hist .d{color:var(--muted)} .hist .c{font-size:12.5px;margin-left:8px;font-weight:600}
.linkBtn{background:none;border:0;color:var(--brand-l);font-weight:600;font-size:14px;padding:8px 0;min-height:40px}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 2px}
.footnote{font-size:12px;color:var(--dim);text-align:center;line-height:1.5;margin:22px 10px 0}
/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-bot) + 12px);z-index:30;width:calc(100% - 24px);max-width:520px;
  display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(26,28,32,.72);border:1px solid rgba(255,255,255,.09);
  backdrop-filter:saturate(1.6) blur(22px);-webkit-backdrop-filter:saturate(1.6) blur(22px);box-shadow:0 10px 30px rgba(0,0,0,.5)}

.tabbar button.on{background:rgba(255,255,255,.08);color:var(--kng)}
/* sheets + modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:94vh;overflow-y:auto;background:#0d0f12;border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--line);
  transform:translateY(105%);transition:transform .42s var(--ease);padding:0 16px calc(var(--safe-bot) + 30px)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#3a3f47;margin:8px auto 0}

.sheetBody{max-width:560px;margin:0 auto}
.tbtn{min-height:44px;min-width:64px;padding:0 10px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:16px}
.tbtn.save{color:var(--kng);font-weight:700}
.field{margin-bottom:12px}
.field label{display:block;font-size:13.5px;color:var(--muted);margin:0 0 6px 2px;font-weight:600}
.inp{display:flex;align-items:center;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:0 14px;min-height:52px;transition:border-color .2s}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grp{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin:20px 2px 10px}
.qrow{display:grid;grid-template-columns:70px 1fr 1fr 36px;gap:8px;align-items:center;margin-bottom:8px}

textarea{width:100%;min-height:110px;background:var(--card);border:1px solid var(--line2);border-radius:14px;color:var(--text);padding:12px;font:12.5px ui-monospace,Menlo,monospace}
.modal{position:fixed;left:50%;top:50%;z-index:60;width:min(340px,calc(100% - 40px));background:#1a1d22;border:1px solid var(--line2);border-radius:20px;padding:20px;
  transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;transition:all .25s var(--ease)}
.modal.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.modal h3{margin:0 0 8px;font-size:18px} .modal p{margin:0 0 18px;color:#c3c9d0;font-size:14.5px;line-height:1.45}

.pickList .lrow .chev{font-size:22px}
.src{font-size:12px;color:var(--muted);line-height:1.6;word-break:break-all}
.src b{color:#cfd4da;font-weight:600}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ---------- What If ---------- */
.wiTag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.6px;color:#c9b6ff;background:rgba(150,120,255,.14);border:1px solid rgba(150,120,255,.45);border-radius:7px;padding:4px 8px}

.chipBtn{scroll-snap-align:start}
.chips::-webkit-scrollbar{display:none}

function pad2(n){ return String(n).padStart(2,'0'); }
function monthKey(d){ d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1); }
function addMonths(k, n){ var p = k.split('-'); return monthKey(new Date(+p[0], (+p[1])-1+n, 1)); }

function rng(seedStr){ var h = 2166136261; for (var i=0;i<seedStr.length;i++){ h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); } return function(){ h += 0x6D2B79F5; var t = h; t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14)>>>0)/4294967296; }; }
function num(v, d){ var n = parseFloat(v); return isFinite(n) ? n : (d === undefined ? 0 : d); }

/* ---------- valuation math (single source of truth) ---------- */
function valueOf(v){ // v = company.valuation
  var ev = v.ttmEbitda * v.evEbitdaMultiple;
  var netDebt = v.totalDebt - (v.cash || 0);
  var equity = ev - netDebt;
  var mine = equity * v.ownershipPct / 100;
  return { ev:ev, netDebt:netDebt, equity:equity, mine:mine, pctGoal: v.goal > 0 ? equity / v.goal * 100 : 0 };
}

/* ---------- company factory + sample data ---------- */
function makeCompany(id, overrides){
  var cat = CATALOG[id] || {};
  var s = cat.sample || { ebitda:1, multiple:5, debt:.5, cash:.1, own:10, margin:.15 };
  var c = {
    id: id,
    name: cat.name || 'New company',
    website: cat.website || '',
    industry: cat.industry || '',
    hq: cat.hq || '',
    logo: LOGOS[id] ? id : null,              // key into LOGOS (or a data: URI for custom logos)
    brand: cat.brand ? { primary:cat.brand.primary, accent:cat.brand.accent } : { primary:'#4C6EF5', accent:'#9AB0FF' },
    isSample: true,
    updatedAt: null,
    dataSource: 'manual',                      // later: 'quickbooks' | 'xero' | 'api' ...
    valuation: { ttmEbitda:s.ebitda*M, evEbitdaMultiple:s.multiple, totalDebt:s.debt*M, cash:s.cash*M, ownershipPct:s.own, goal:200*M },
    quarterly: [],
    history: []
  };
  if (overrides) Object.keys(overrides).forEach(function(k){ c[k] = overrides[k]; });
  var seed = c.isSample && PLAN_SEED[id];
  if (seed && seed.valuation){ c.valuation.ttmEbitda = seed.valuation.ttmEbitda; c.valuation.cash = seed.valuation.cash; }
  if (c.isSample){ c.quarterly = sampleQuarterly(c, s.margin); c.history = sampleHistory(c); }
  ensureFeatures(c);
  return c;
}
function sampleHistory(c){
  var now = valueOf(c.valuation).equity, cur = monthKey(), r = rng(c.id + 'h'), out = [], n = 12;
  for (var i = 0; i < n; i++){
    var k = addMonths(cur, i - n), t = i / (n - 1);
    var trend = 0.80 + 0.175 * t;                          // modest climb to ~97.5% of today
    var wobble = (r() - 0.5) * 0.035 + (i === 4 ? -0.03 : 0); // small noise + one soft month
    var v = Math.round(now * (trend + wobble) / 1e4) * 1e4;
    var p = k.split('-');
    out.push({ month:k, recordedAt:new Date(+p[0], +p[1]-1, 28).toISOString(), shareholderValue:v, myShare:v * c.valuation.ownershipPct/100, sample:true });
  }
  return out;
}
function sampleQuarterly(c, margin){
  var lastQ = addQuarters(quarterKey(), -1), r = rng(c.id + 'q'), out = [], ttm = c.valuation.ttmEbitda;
  var w = [0.86, 0.9, 0.94, 0.98, 1.02, 1.06]; // growth weights over 6 quarters; last 4 sum ~= TTM
  var last4 = w.slice(2).reduce(function(a,b){return a+b;},0);
  for (var i = 0; i < 6; i++){
    var e = ttm * w[i] / last4 * (1 + (r()-0.5)*0.08);
    var m = margin * (1 + (r()-0.5)*0.12);
    out.push({ period: addQuarters(lastQ, i-5), revenue: Math.round(e/m/1e4)*1e4, ebitda: Math.round(e/1e4)*1e4, sample:true });
  }
  var s4 = out.slice(-4).reduce(function(a,q){ return a + q.ebitda; }, 0); out[5].ebitda += ttm - s4; // last 4 quarters sum exactly to TTM EBITDA
  return out;
}
function seedState(){
  return { schema:SCHEMA, schemaVersion:SCHEMA_VERSION, portfolio:{ name:'KNG Capital', goal:200*M, seededIds:DEFAULT_IDS.slice() }, companies: DEFAULT_IDS.map(function(id){ return makeCompany(id); }) };
}

/* ---------- validation / normalisation ---------- */
function normalizeCompany(c, i){
  var cat = CATALOG[c.id] || {};
  var v = c.valuation || {};
  var out = {
    id: String(c.id || ('company-' + (i+1))),
    name: String(c.name || cat.name || ('Company ' + (i+1))).slice(0,60),
    website: c.website || cat.website || '',
    industry: c.industry || cat.industry || '',
    hq: c.hq || cat.hq || '',
    logo: c.logo && (LOGOS[c.logo] || /^data:image\//.test(c.logo)) ? c.logo : (LOGOS[c.id] ? c.id : null),
    brand: c.brand && /^#[0-9a-f]{6}$/i.test(c.brand.primary||'') ? { primary:c.brand.primary, accent: /^#[0-9a-f]{6}$/i.test(c.brand.accent||'') ? c.brand.accent : c.brand.primary } : (cat.brand || { primary:'#4C6EF5', accent:'#9AB0FF' }),
    isSample: !!c.isSample,
    updatedAt: c.updatedAt || null,
    dataSource: c.dataSource || 'manual',
    valuation: { ttmEbitda:num(v.ttmEbitda), evEbitdaMultiple:num(v.evEbitdaMultiple), totalDebt:num(v.totalDebt), cash:num(v.cash), ownershipPct:num(v.ownershipPct), goal:num(v.goal, 200*M) || 200*M },
    quarterly: (Array.isArray(c.quarterly) ? c.quarterly : []).filter(function(q){ return q && /^\d{4}-Q[1-4]$/.test(q.period); })
      .map(function(q){ return { period:q.period, revenue:num(q.revenue), ebitda:num(q.ebitda), sample:!!q.sample }; })
      .sort(function(a,b){ return a.period < b.period ? -1 : 1; }),
    history: (Array.isArray(c.history) ? c.history : []).filter(function(h){ return h && /^\d{4}-\d{2}$/.test(h.month) && isFinite(+h.shareholderValue); })
      .map(function(h){ return { month:h.month, recordedAt:h.recordedAt || new Date().toISOString(), shareholderValue:+h.shareholderValue, myShare: isFinite(+h.myShare) ? +h.myShare : null, sample:!!h.sample }; })
      .sort(function(a,b){ return a.month < b.month ? -1 : 1; }),
    plan: normPlan(c.plan),
    actuals: c.actuals === undefined ? undefined : normActuals(c.actuals),
    fees: normFees(c.fees),
    milestones: c.milestones === undefined ? undefined : normMilestones(c.milestones),
    locLimit: c.locLimit === undefined ? undefined : (c.locLimit === null || c.locLimit === '' || !isFinite(+c.locLimit) ? null : Math.max(0, +c.locLimit)),
    ebitdaBasis: typeof c.ebitdaBasis === 'string' ? c.ebitdaBasis.slice(0, 40) : '',
    sampleNote: typeof c.sampleNote === 'string' ? c.sampleNote.slice(0, 240) : ''
  };
  ensureFeatures(out);
  return out;
}
function normalizeState(s){
  var ids = {};
  var cos = s.companies.map(normalizeCompany).filter(function(c){ if (ids[c.id]) return false; ids[c.id] = 1; return true; });
  /* Add default KNG companies this device has never been offered (e.g. phones saved before all six were included).
     Existing companies are left untouched; a company the user removed is not re-added (tracked in seededIds). */
  var seeded = (s.portfolio && Array.isArray(s.portfolio.seededIds)) ? s.portfolio.seededIds.slice() : ORIGINAL_IDS.slice();
  DEFAULT_IDS.forEach(function(id){ if (seeded.indexOf(id) < 0){ if (!ids[id]){ cos.push(makeCompany(id)); ids[id] = 1; } seeded.push(id); } });
  return { schema:SCHEMA, schemaVersion:SCHEMA_VERSION, portfolio:{ name: (s.portfolio && s.portfolio.name) || 'KNG Capital', goal: num(s.portfolio && s.portfolio.goal, 200*M) || 200*M, seededIds:seeded }, companies:cos };
}
function isV2(s){ return s && (s.schemaVersion === 2 || s.schemaVersion === 3) && Array.isArray(s.companies) && s.companies.every(function(c){ return c && c.valuation && isFinite(+c.valuation.ttmEbitda); }); }
function isV1(s){ return s && Array.isArray(s.companies) && s.companies.length && s.companies.every(function(c){ return c && isFinite(+c.ebitda) && isFinite(+c.multiple); }); }

/* v1 (single-file app: FourQuest / Company 2 / Company 3) -> v2 */
function migrateV1(s){
  var defaultsV1 = ['FourQuest', 'Company 2', 'Company 3'];
  var out = seedState();
  out.portfolio.seededIds = ORIGINAL_IDS.slice(); // v1 only knew three slots; normalizeState adds the rest
  out.companies = s.companies.map(function(old, i){
    var id = ORIGINAL_IDS[i] || ('company-' + (i+1));
    if (old.isSample && i < ORIGINAL_IDS.length) return makeCompany(id); // untouched sample -> fresh KNG sample
    var c = makeCompany(id, { isSample:false });
    if (defaultsV1.indexOf(old.name) < 0 && old.name) c.name = String(old.name);
    c.updatedAt = old.updatedAt || null;
    c.valuation = { ttmEbitda:num(old.ebitda), evEbitdaMultiple:num(old.multiple), totalDebt:num(old.debt), cash:num(old.cash), ownershipPct:num(old.ownership), goal:num(old.goal, 200*M) || 200*M };
    c.quarterly = [];
    c.history = (old.history || []).filter(function(h){ return h && h.month && !h.sample; }).map(function(h){
      return { month:h.month, recordedAt:h.date || new Date().toISOString(), shareholderValue:+h.value, myShare: h.mine != null ? +h.mine : null, sample:false };
    });
    return c;
  });
  return normalizeState(out);
}
/* Accepts: v2 state, {app,data:v2}, v1 state, {app,data:v1}. Throws on anything else. */
function parseAny(obj){
  if (obj && obj.kind === 'plan-update' && obj.plan) return { planUpdate: obj };
  var s = obj && obj.data && !obj.companies ? obj.data : obj;
  if (isV2(s)) return { state: normalizeState(s), scenarios: obj && obj.scenarios, migrated:false };
  if (isV1(s)) return { state: migrateV1(s), scenarios: null, migrated:true };
  throw new Error('Not a KNG Portfolio export.');
}
function loadState(){
  try { var raw = localStorage.getItem(STORE_KEY); if (raw) return parseAny(JSON.parse(raw)).state; } catch(e){}
  try { var old = localStorage.getItem(LEGACY_KEY); if (old){ var r = parseAny(JSON.parse(old)); if (r.migrated){ r.state._migrated = true; return r.state; } } } catch(e){}
  return seedState();
}

/* ---------- series helpers ---------- */
function companySeries(c){ // monthly snapshots + today's live value as the current month
  var cur = monthKey(), live = valueOf(c.valuation);
  var pts = c.history.filter(function(h){ return h.month < cur; }).map(function(h){ return { month:h.month, value:h.shareholderValue, mine: h.myShare != null ? h.myShare : h.shareholderValue * c.valuation.ownershipPct/100 }; });
  pts.push({ month:cur, value:live.equity, mine:live.mine, live:true, recorded: c.history.some(function(h){ return h.month === cur; }) });
  return pts;
}
function portfolioSeries(cos){
  if (!cos.length) return [];
  var series = cos.map(companySeries);
  var start = series.reduce(function(m, s){ return s[0].month > m ? s[0].month : m; }, '0000-00'); // only months where every company has data
  var months = {};
  series.forEach(function(s){ s.forEach(function(p){ if (p.month >= start) months[p.month] = 1; }); });
  return Object.keys(months).sort().map(function(m){
    var v = 0, mine = 0;
    series.forEach(function(s){ var best = null; s.forEach(function(p){ if (p.month <= m) best = p; }); if (best){ v += best.value; mine += best.mine; } });
    return { month:m, value:v, mine:mine, live: m === monthKey() };
  });
}
function sliceRange(pts, range){
  if (!pts.length) return pts;
  var cur = monthKey(), from;
  if (range === '1M') from = addMonths(cur, -1);
  else if (range === '6M') from = addMonths(cur, -6);
  else if (range === 'YTD') from = (+cur.slice(0,4) - 1) + '-12';
  else if (range === '1Y') from = addMonths(cur, -12);
  else return pts.slice();
  var out = pts.filter(function(p){ return p.month >= from; });
  return out.length ? out : pts.slice(-1);
}
function priorPoint(pts){ return pts.length > 1 ? pts[pts.length-2] : null; }

/* ===================== v3: PLAN · ACTUALS · FEES · MILESTONES =====================
 * company.plan       = { label:'2027 Plan', year, sample, currency, source, importedAt, ebitdaBasis, openingCash,
 *                        targets:{ revenue, grossMarginPct, ebitdaPct }, months:[{ m:'2027-01', revenue, grossProfit, ebitda, cash }] }
 * company.actuals    = [{ m:'2027-01', revenue, grossProfit|null, ebitda, cash|null, sample }]   (entered monthly; never overwritten by imports)
 * company.fees       = { label, treatment:'above'|'below', monthly, schedule:[{ m, amount }], source:'plan'|'manual'|'sample', sample }
 * company.milestones = [{ id, title, date:'YYYY-MM-DD'|'YYYY-MM'|'', status:'upcoming'|'done', note, sample }]
 * company.locLimit   = line of credit available (null = not set; the app then shows a suggested size)
 * Missing fields are filled by ensureFeatures(); fields that already exist (incl. empty lists) are never overwritten.
 */
var PLAN_SEED = typeof PLAN_SEED !== 'undefined' ? PLAN_SEED : {};
var SAMPLE_FEES = { 'fourquest-energy':30000, 'fqe-power':15000, 'fqe-chemicals':8000, 'ohana-care':5000, 'aten-realty':4000 };
var SAMPLE_LOC = { 'fqe-power':500000 };
var MKEY = /^\d{4}-\d{2}$/;
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function nOrNull(v){ return v === null || v === undefined || v === '' || !isFinite(+v) ? null : +v; }
function normPlan(p){
  if (!p || !Array.isArray(p.months)) return undefined;
  var months = p.months.filter(function(m){ return m && MKEY.test(m.m); }).map(function(m){ return { m:m.m, revenue:num(m.revenue), grossProfit:num(m.grossProfit), ebitda:num(m.ebitda), cash:num(m.cash) }; })
    .sort(function(a,b){ return a.m < b.m ? -1 : 1; });
  if (!months.length) return undefined;
  var t = p.targets || {};
  return { label:String(p.label || (months[0].m.slice(0,4) + ' Plan')).slice(0,30), year:+p.year || +months[0].m.slice(0,4), sample:!!p.sample, currency:p.currency || 'USD',
    source:String(p.source || '').slice(0,120), importedAt:p.importedAt || null, ebitdaBasis:p.ebitdaBasis || '', openingCash:num(p.openingCash),
    targets:{ revenue:nOrNull(t.revenue), grossMarginPct:nOrNull(t.grossMarginPct), ebitdaPct: nOrNull(t.ebitdaPct) == null ? 18 : +t.ebitdaPct }, months:months };
}
function normActuals(a){
  return (Array.isArray(a) ? a : []).filter(function(x){ return x && MKEY.test(x.m) && isFinite(+x.revenue); })
    .map(function(x){ return { m:x.m, revenue:+x.revenue, grossProfit:nOrNull(x.grossProfit), ebitda:nOrNull(x.ebitda), cash:nOrNull(x.cash), sample:!!x.sample }; })
    .sort(function(a,b){ return a.m < b.m ? -1 : 1; });
}
function normFees(f){
  if (!f || typeof f !== 'object') return undefined;
  var sched = (Array.isArray(f.schedule) ? f.schedule : []).filter(function(x){ return x && MKEY.test(x.m); }).map(function(x){ return { m:x.m, amount:Math.max(0, num(x.amount)) }; });
  return { label:String(f.label || 'Directors’ / shareholder fees').slice(0,60), treatment: f.treatment === 'below' ? 'below' : 'above', monthly:Math.max(0, num(f.monthly)),
    schedule:sched, source: ['plan','manual','sample'].indexOf(f.source) >= 0 ? f.source : 'manual', sample:!!f.sample };
}
function normMilestones(list){
  return (Array.isArray(list) ? list : []).filter(function(x){ return x && x.title; }).slice(0, 8).map(function(x, i){
    var d = String(x.date || ''); if (!/^\d{4}-\d{2}(-\d{2})?$/.test(d)) d = '';
    return { id:String(x.id || ('ms' + i + Date.now().toString(36))), title:String(x.title).slice(0,80), date:d, status: x.status === 'done' ? 'done' : 'upcoming', note:String(x.note || '').slice(0,120), sample:!!x.sample };
  });
}
function feesAnnual(c){ var f = c.fees; if (!f) return 0; if (f.schedule && f.schedule.length) return f.schedule.slice(-12).reduce(function(s,x){ return s + x.amount; }, 0); return f.monthly * 12; }
function feesMonthly(c){ return feesAnnual(c) / 12; }
function feesBasis(c){ var f = c.fees; if (!f) return ''; if (f.schedule && f.schedule.length && f.source === 'plan') return (c.plan && c.plan.label) || 'plan'; return f.sample ? 'sample' : 'last 12 months'; }

/* ---------- samples (clearly labelled) ---------- */
function samplePlan(c, s){
  var yr = new Date().getFullYear(), r = rng(c.id + 'p'), rev = s.ebitda*M/s.margin, gm = Math.min(.9, s.margin + .22), w = [], sw = 0, i;
  for (i = 0; i < 12; i++){ w[i] = 1 + .12*Math.sin((i-2)/12*2*Math.PI) + (r()-.5)*.06; sw += w[i]; }
  var cash = s.cash*M, months = [], net = s.ebitda*M/12*.45 - s.debt*M*.08/12;
  var swing = c.id === 'fqe-power' ? [0,0,-6,-6,0,6,6,0,0,0,0,0] : null; // one sample company shows a covered seasonal dip
  for (i = 0; i < 12; i++){
    var revenue = rev*w[i]/sw, e = revenue*s.margin*(1 + (r()-.5)*.16), gp = revenue*gm*(1 + (r()-.5)*.04);
    cash += e*.45 - s.debt*M*.08/12 + (swing ? swing[i]*net : 0);
    months.push({ m:yr + '-' + pad2(i+1), revenue:Math.round(revenue), grossProfit:Math.round(gp), ebitda:Math.round(e), cash:Math.round(cash) });
  }
  return { label:yr + ' Plan', year:yr, sample:true, currency:'USD', source:'Sample plan', importedAt:null, ebitdaBasis:'', openingCash:s.cash*M,
    targets:{ revenue:Math.round(rev*.98/1e5)*1e5, grossMarginPct:Math.round(gm*100), ebitdaPct:Math.max(10, Math.round(s.margin*100) - 1) }, months:months };
}
function sampleActuals(c, s){
  var cur = monthKey(), r = rng(c.id + 'a');
  return c.plan.months.filter(function(m){ return m.m < cur; }).map(function(m){
    var rv = m.revenue*(1 + (r()-.45)*.1);
    return { m:m.m, revenue:Math.round(rv), grossProfit:Math.round(rv*(m.grossProfit/m.revenue)*(1 + (r()-.5)*.04)), ebitda:Math.round(m.ebitda*(1 + (r()-.45)*.18)),
      cash:Math.round(m.cash + (r()-.5)*.08*Math.max(Math.abs(m.cash), s.cash*M)), sample:true };
  });
}
function sampleFees(c, s){ var mo = SAMPLE_FEES[c.id] != null ? SAMPLE_FEES[c.id] : Math.round(s.ebitda*M*.02/12/500)*500;
  return { label:'Directors’ / shareholder fees', treatment:'above', monthly:mo, schedule:[], source:'sample', sample:true }; }
function sampleMilestones(c){
  var yr = new Date().getFullYear(), r = rng(c.id + 'm'), d = function(m, day){ return m + '-' + pad2(Math.min(28, day + Math.floor(r()*6))); };
  return normMilestones([
    { title:'H1 results reviewed', date:d(yr + '-08', 12), status:'done', sample:true },
    { title:'Q3 results reviewed', date:d(yr + '-11', 10), status:'upcoming', sample:true },
    { title:(yr+1) + ' budget approved', date:d(yr + '-12', 4), status:'upcoming', sample:true },
    { title:'Year-end close', date:(yr+1) + '-01', status:'upcoming', sample:true }
  ]);
}
function dqMilestones(){ // from the DataQuestCX 2027 operating plan (Read Me timeline, Costs notes, Revenue tab)
  return normMilestones([
    { id:'dq-lock', title:'2027 plan locked', date:'2026-10-27', status:'upcoming', note:'Plan review Oct 25; final lock Oct 27' },
    { id:'dq-track', title:'Plan vs actual tracking starts', date:'2027-01', status:'upcoming', note:'Monthly results vs the 2027 Plan' },
    { id:'dq-kid', title:'KID expansion: signed paper', date:'2027-04', status:'upcoming', note:'Plan has this work starting in April' },
    { id:'dq-latam', title:'LATAM / Europe: go or no-go', date:'', status:'upcoming', note:'Not in the base budget until decided' }
  ]);
}
var DQ_NOTE = 'EBITDA and cash are from the 2027 Plan. Multiple, debt and ownership are sample numbers (the plan has none).';
function ensureFeatures(c){
  var cat = CATALOG[c.id] || {}, s = cat.sample || { ebitda:1, multiple:5, debt:.5, cash:.1, own:10, margin:.15 }, seed = PLAN_SEED[c.id];
  if (seed && (!c.plan || c.plan.sample)){ // real plan replaces a missing or sample plan; never replaces an imported one
    c.plan = normPlan(seed.plan);
    if (!c.fees || c.fees.sample) c.fees = seed.fees ? normFees(seed.fees) : c.fees;
    if (c.isSample && seed.valuation){ // still on sample valuation inputs -> align EBITDA and cash with the plan
      var changed = Math.abs(c.valuation.ttmEbitda - seed.valuation.ttmEbitda) > 1 || Math.abs(c.valuation.cash - seed.valuation.cash) > 1;
      c.valuation.ttmEbitda = seed.valuation.ttmEbitda; c.valuation.cash = seed.valuation.cash;
      c.ebitdaBasis = 'FY' + String(c.plan.year).slice(2) + ' plan'; c.sampleNote = DQ_NOTE;
      if (changed){ c.history = c.history.filter(function(h){ return !h.sample; }).concat(sampleHistory(c)).sort(function(a,b){ return a.month < b.month ? -1 : 1; });
        if (c.quarterly.every(function(q){ return q.sample; })) c.quarterly = sampleQuarterly(c, s.margin); }
    }
    if (c.actuals) c.actuals = c.actuals.filter(function(a){ return !a.sample; });
  }
  if (!c.plan) c.plan = samplePlan(c, s);
  if (!c.actuals) c.actuals = c.plan.sample ? sampleActuals(c, s) : [];
  if (!c.fees) c.fees = sampleFees(c, s);
  if (!c.milestones) c.milestones = c.id === 'dataquestcx' ? dqMilestones() : sampleMilestones(c);
  if (c.locLimit === undefined) c.locLimit = c.plan.sample && SAMPLE_LOC[c.id] ? SAMPLE_LOC[c.id] : null;
  if (c.ebitdaBasis === undefined) c.ebitdaBasis = '';
  if (c.sampleNote === undefined) c.sampleNote = '';
  return c;
}
/* Settings import of a tools/import_plan.py file: updates one company's plan (+ plan fee schedule). Actuals, milestones,
   snapshots and user-entered valuation inputs are kept. */
function applyPlanUpdate(st, u){
  var c = st.companies.filter(function(x){ return x.id === u.companyId; })[0];
  if (!c) throw new Error('No company with id “' + u.companyId + '” on this device.');
  var p = normPlan(u.plan); if (!p) throw new Error('The plan file has no monthly figures.');
  c.plan = p;

function barChart(box, groups, c){ // groups: [{label, revenue, ebitda}]
  var W = box.clientWidth || 320, H = 210, padL = 46, padB = 26, padT = 10;
  var max = Math.max.apply(null, groups.map(function(g){ return Math.max(g.revenue, g.ebitda, 0); }).concat([1]));
  var step = Math.pow(10, Math.floor(Math.log10(max/4))), nice = [1,2,2.5,5,10].map(function(k){ return k*step; }).filter(function(s){ return s*4 >= max; })[0] || step*10;
  var top = nice*4, n = groups.length, gw = (W-padL)/n, bw = Math.min(26, gw*.3);
  var y = function(v){ return padT + (1 - Math.max(0,v)/top) * (H-padT-padB); };
  var rev = lighten(c.brand.primary, .62), ebd = c.brand.accent;
  var hr = hexToHsl(c.brand.primary), ha = hexToHsl(c.brand.accent), dh = Math.abs(hr[0]-ha[0]); dh = Math.min(dh, 360-dh);
  if (dh < 25 && Math.abs(Math.max(hr[2], .62) - ha[2]) < .2) rev = '#d5dae1'; // brand colours too close (e.g. yellow/yellow): neutral revenue bars
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">';
  for (var i=0;i<=4;i++){ var v = nice*i, yy = y(v); s += '<line x1="' + padL + '" x2="' + W + '" y1="' + yy + '" y2="' + yy + '" stroke="#2a2f37" stroke-width="1"/><text x="' + (padL-8) + '" y="' + (yy+4) + '" text-anchor="end" font-size="11" fill="#8a939e">' + moneyAxis(v) + '</text>'; }
  groups.forEach(function(g, i){
    var cx = padL + gw*i + gw/2;
    s += '<rect x="' + (cx-bw-3) + '" y="' + y(g.revenue) + '" width="' + bw + '" height="' + (y(0)-y(g.revenue)) + '" rx="3" fill="' + rev + '" style="animation-delay:' + (i*60) + 'ms"><title>Revenue ' + money(g.revenue) + '</title></rect>';
    s += '<rect x="' + (cx+3) + '" y="' + y(g.ebitda) + '" width="' + bw + '" height="' + (y(0)-y(g.ebitda)) + '" rx="3" fill="' + ebd + '" style="animation-delay:' + (i*60+40) + 'ms"><title>EBITDA ' + money(g.ebitda) + '</title></rect>';
    s += '<text x="' + cx + '" y="' + (H-6) + '" text-anchor="middle" font-size="11.5" fill="#c9cfd6">' + esc(g.label) + '</text>';
  });
  box.innerHTML = s + '</svg>';
  return { rev:rev, ebd:ebd };
}

function chgHtml(d, dp, prev, label){
  if (d == null) return '<span class="flat when">No prior month recorded yet</span>';
  return '<span class="' + dir(d) + '">' + arrow(d) + ' ' + signed(d) + (dp != null ? ' (' + pct(dp) + ')' : '') + '</span><span class="when">' + (label || ('vs ' + mLabel(prev.month))) + '</span>';
}
function rangesHtml(sel, key){
  return '<div class="ranges" role="tablist">' + ['1M','6M','YTD','1Y','ALL'].map(function(r){ return '<button class="' + (r === sel ? 'on' : '') + '" data-range="' + key + ':' + r + '">' + r + '</button>'; }).join('') + '</div>';
}
function rangeNote(pts, label){
  if (pts.length < 2) return 'Not enough history for this range yet.';
  var a = pts[0].value, b = pts[pts.length-1].value, d = b - a;
  return '<span class="' + dir(d) + '">' + signed(d) + (a ? ' (' + pct(d/Math.abs(a)*100) + ')' : '') + '</span> since ' + mLabel(pts[0].month, true) + ' · monthly snapshots';
}
function drawPortfolioChart(series){
  var pts = sliceRange(series || portfolioSeries(state.companies), ui.pRange), hero = $('pHero'), chg = $('pChg'), base = chg.innerHTML;
  areaChart($('pChart'), pts, { onScrub: function(p, first){
    if (!p){ hero.textContent = money(+hero.dataset.v); chg.innerHTML = base; return; }
    hero.textContent = money(p.value); var d = p.value - first.value;
    chg.innerHTML = chgHtml(d, first.value ? d/Math.abs(first.value)*100 : null, first, (p.live ? 'today' : mLabel(p.month, true)) + ' vs ' + mLabel(first.month, true));
  }});
  $('pRangeNote').innerHTML = rangeNote(pts);
}
function animateBars(root){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ root.querySelectorAll('.bar i[data-w]').forEach(function(i){ i.style.width = i.dataset.w + '%'; }); }); }); }

function exportJSON(){ return JSON.stringify({ app:'kng-portfolio', exportedAt:new Date().toISOString(), data:state, scenarios:scen.saved }, null, 2); }
function doImport(text){
  var r;

    return ask('Update ' + tc.name + '’s plan?', 'Replace ' + tc.name + '’s plan with “' + ((u.plan && u.plan.label) || 'plan') + '” from ' + (u.plan && u.plan.source || 'the file') + '? Actuals, milestones, snapshots and the valuation inputs you entered are kept.', 'Update plan').then(function(ok){
      if (!ok) return;

    });

function feesEditHtml(c){

  var lo = sch ? Math.min.apply(null, f.schedule.map(function(x){ return x.amount; })) : 0, hi = sch ? Math.max.apply(null, f.schedule.map(function(x){ return x.amount; })) : 0;
  return '<div class="grp">Fees &amp; draws' + (f.sample ? ' <span class="smallTag">SAMPLE</span>' : '') + '</div>' +

    '<div class="field"><label>How they are paid</label><div class="seg wide"><button data-ft="above" class="' + (f.treatment !== 'below' ? 'on' : '') + '">Above EBITDA (expense)</button><button data-ft="below" class="' + (f.treatment === 'below' ? 'on' : '') + '">Below EBITDA (distribution)</button></div></div>';

function planEditHtml(c){
  var p = c.plan; if (!p) return '';
  var t = p.targets || {}, hl = healthOf(c), sug = hl && hl.cash.gap ? suggestedLoc(hl.cash.gap) : 0;
  return '<div class="grp">' + esc(p.label) + ' targets' + (p.sample ? ' <span class="smallTag">SAMPLE PLAN</span>' : '') + '</div>' +
    inp('eTR', 'Revenue target', t.revenue != null ? trim(t.revenue/M) : '', '$', 'M') +
    '<div class="two">' + inp('eTG', 'Gross margin target', t.grossMarginPct != null ? trim(t.grossMarginPct) : '', '', '%') + inp('eTE', 'EBITDA margin target', trim(t.ebitdaPct == null ? 18 : t.ebitdaPct), '', '%') + '</div>' +
    inp('eL', 'Line of credit available', c.locLimit ? trim(c.locLimit/1000) : '', '$', 'K', c.locLimit ? 'Used for the cash runway.' : (sug ? 'Blank = not set. The cash runway shows a suggested ' + money(sug) + ' (gap + 10%, rounded up to $50K).' : 'Blank = not set.'));
}
function readFeesPlan(){
  var o = { fee: num($('eF').value, NaN) * 1000, err:'' };

    if (!r){ h += '<div class="scard"><div class="top"><b>' + esc(s.name) + '</b><span>' + esc(tn) + '</span></div><p class="note">This company is no longer in the portfolio.</p><div class="acts"><button data-sdel="' + i + '">Delete</button></div></div>'; return; }

    h += '<div class="scard"><div class="top"><b>' + esc(s.name) + '</b><span>' + esc(tn) + '</span></div><table class="num">' +
      '<tr><td>Shareholder value</td><td>' + money(b.equity, 1) + ' → ' + money(a.equity, 1) + '</td></tr>' +
      '<tr><td>My share</td><td class="' + dir(a.mine - b.mine) + '">' + signed(a.mine - b.mine, 1) + '</td></tr>' +
      '<tr><td>Cash in hand</td><td>' + money(a.cashInHand, 1) + '</td></tr>' +
      '<tr><td>Net debt</td><td>' + money(a.netDebt, 1) + '</td></tr>' +
      '<tr><td>Progress to goal</td><td>' + pctPlain(a.goal ? a.equity/a.goal*100 : 0) + '</td></tr></table>' +
      '<div class="acts"><button data-sload="' + i + '">Load</button><button data-sdel="' + i + '">Delete</button></div></div>';
  });
  el.innerHTML = h;
  el.querySelectorAll('[data-sload]').forEach(function(bt){ bt.onclick = function(){ var s = list[+bt.dataset.sload]; scen.target = s.target; scen.adj = JSON.parse(JSON.stringify(s.adj || {})); scen.overlay = JSON.parse(JSON.stringify(s.overlay || { growth:0, multDelta:0 })); if (s.ret != null) scen.ret = s.ret; saveScen(); renderWhatIf(); $('v-whatif').scrollTop = 0; toast('Loaded “' + s.name + '”'); }; });
  el.querySelectorAll('[data-sdel]').forEach(function(bt){ bt.onclick = function(){ scen.saved.splice(+bt.dataset.sdel, 1); saveScen(); renderSaved(); }; });
}
function saveScenarioPrompt(){
  if (scen.saved.length >= 3) return toast('You can keep 3 scenarios. Delete one first.');
  var t = scen.target, tn = t === 'portfolio' ? 'Portfolio' : byId(t).name;
  openSheet('<div class="sheetHead"><button class="tbtn" data-x>Cancel</button><h2>Save scenario</h2><button class="tbtn save" id="scOk">Save</button></div><div class="sheetBody">' +
    '<div class="field"><label for="scName">Name</label><div class="inp"><input id="scName" type="text" maxlength="40" value="' + esc(tn + ' scenario ' + (scen.saved.length + 1)) + '" style="font-size:17px"></div></div>' +
    '<p class="note">Saves the current changes for ' + esc(tn) + '. Your real figures are not changed.</p><button class="btn kng" id="scOk2">Save scenario</button></div>', function(s){
      s.querySelector('[data-x]').onclick = closeSheet;
      function ok(){ var n = $('scName').value.trim() || 'Scenario'; scen.saved.push({ id:Date.now().toString(36), name:n, createdAt:new Date().toISOString(), target:t,
        adj: JSON.parse(JSON.stringify(t === 'portfolio' ? scen.adj : (function(){ var o = {}; o[t] = adjFor(t); return o; })())), overlay: JSON.parse(JSON.stringify(scen.overlay)), ret:scen.ret });
        saveScen(); closeSheet(); renderSaved(); toast('Saved “' + n + '”'); }
      $('scOk').onclick = $('scOk2').onclick = ok;
    });
}

/* ---------- Fees & draws: cash now vs value (company scenario) ---------- */
function buildFeeCard(c){
  var a = adjFor(c.id), now = feesMonthly(c), max = now > 0 ? now * 2 : 25000, st = niceStep(max), top = Math.ceil(max/st)*st, val = a.fee == null ? now : a.fee;
  ctlFmt.fee = function(x){ return money(x) + '/mo'; };
  var f = c.fees || {}, sch = f.schedule && f.schedule.length;
  $('wiFees').innerHTML = '<div class="cardHead"><div class="label">Fees &amp; draws: cash now vs value</div><span class="wiTag">SCENARIO</span></div>' +
    '<div class="ctl" style="padding-top:0">' + '<div class="ctlTop"><label for="wi_fee">Directors’ / shareholder fees</label><output id="wo_fee">' + ctlFmt.fee(val) + '</output></div>' +
    '<div class="ctlRow"><button class="step" data-fstep="-1" aria-label="Decrease">−</button><input type="range" id="wi_fee" min="0" max="' + top + '" step="' + st + '" value="' + val + '"><button class="step" data-fstep="1" aria-label="Increase">+</button></div>' +
    '<div class="hint">Today ' + money(now) + '/mo, ' + money(now*12) + ' a year' + (sch && f.source === 'plan' ? ' (' + esc((c.plan && c.plan.label) || 'plan') + ' average)' : '') + (f.sample ? ' · sample' : '') + '. ' + (f.treatment === 'below' ? 'Paid below EBITDA as a distribution.' : 'Paid above EBITDA as an expense.') + ' Slide from $0 to 2× today.</div></div><div id="wiFeeOut"></div>';
  var r = $('wi_fee'); fill(r);
  r.oninput = function(){ setFee(c, +r.value); fill(r); };
  $('wiFees').querySelectorAll('[data-fstep]').forEach(function(b){ b.onclick = function(){ r.value = Math.min(+r.max, Math.max(0, +r.value + (+b.dataset.fstep) * st)); setFee(c, +r.value); fill(r); }; });
}
function setFee(c, val){
  var now = feesMonthly(c), st = +$('wi_fee').step, a = scen.adj[c.id] = scen.adj[c.id] || blankAdj();
  a.fee = Math.abs(val - now) < st/2 ? null : val;
  $('wo_fee').textContent = ctlFmt.fee(a.fee == null ? now : val);
  saveScen(); updateWhatIf();
  var chip = $('wiChips').querySelector('.on'); if (chip && !/•$/.test(chip.textContent) && !isBlank(a)) chip.insertAdjacentText('beforeend', ' •');
}
function updateFeeOut(c, s){
  var el = $('wiFeeOut'); if (!el) return;
  var own = s.own/100, mult = s.mult, F = s.feeNew, cashYou = F*own, above = s.feeAbove;
  var given = above ? F*mult*own : F*own, years = above ? mult : 1, dCash = s.dFee*own, dVal = above ? -s.dFee*mult*own : -s.dFee*own;
  var h = '<div class="ftiles num"><div><span>Cash to you / year</span><b>' + money(cashYou) + '</b><small class="' + (Math.abs(dCash) < 1 ? 'flat' : dir(dCash)) + '">' + (Math.abs(dCash) < 1 ? 'same as today' : signed(dCash) + ' vs today') + '</small></div>' +
    '<div><span>Value given up (your share)</span><b>' + money(given) + '</b><small class="' + (Math.abs(dVal) < 1 ? 'flat' : dir(dVal)) + '">' + (Math.abs(dVal) < 1 ? 'same as today' : (dVal > 0 ? '+' : '−') + money(Math.abs(dVal)) + ' value vs today') + '</small></div>' +
    '<div><span>Years of fees to equal it</span><b>' + (F > 0 ? years.toFixed(1) : '—') + '</b><small>' + (F > 0 ? (above ? '= the multiple' : 'dollar for dollar') : 'no fees') + '</small></div></div>';
  if (F > 0){
    h += '<div class="fchart" id="feeChart"></div><div class="lg sm"><span><i style="background:#ffc600"></i>Cash you’ve received (cumulative)</span><span><i class="ln" style="background:#5fe0a6"></i>Value given up</span></div>';
    h += '<p class="plain">At <b>' + money(F/12) + ' a month</b>, fees pay you about <b>' + money(cashYou) + ' a year</b> (' + trim(s.own) + '% ownership, assuming fees follow ownership). ' +
      (above ? 'Because they are an expense above EBITDA, they lower EBITDA by ' + money(F) + ', which at ' + mult.toFixed(1) + '× lowers company value by <b>' + money(F*mult) + '</b>, or <b>' + money(given) + '</b> for your share. It takes about <b>' + years.toFixed(1) + ' years</b> of fees to equal that, and the value only becomes cash in a sale or refinancing.'
             : 'Paid below EBITDA as a distribution, they don’t touch EBITDA or the multiple: each $1 paid lowers cash, and value, by $1.') +
      (Math.abs(s.dFee) >= 1 ? ' Compared with today: ' + signed(dCash) + ' cash a year, ' + (dVal > 0 ? '+' : '−') + money(Math.abs(dVal)) + ' value.' : '') + '</p>';
  } else h += '<p class="plain">With no fees, nothing is paid out and no value is given up' + (s.feeNow > 0 ? ': compared with today, ' + signed(dCash) + ' cash a year to you and +' + money(Math.abs(dVal)) + ' value for your share.' : '.') + '</p>';
  h += '<p class="note">Scenario, not a forecast. Uses this company’s ' + mult.toFixed(1) + '× multiple and your ' + trim(s.own) + '% ownership; ignores tax.</p>';
  el.innerHTML = h;
  if ($('feeChart')) feeChart($('feeChart'), cashYou, given);
}
function feeChart(box, perYr, flat){
  var W = box.clientWidth || 320, H = 150, padL = 8, padR = 8, padT = 22, padB = 22, n = 5;
  var top = Math.max(perYr*n, flat) * 1.12 || 1, gw = (W-padL-padR)/n, bw = Math.min(34, gw*.5);
  var y = function(v){ return padT + (1 - v/top)*(H-padT-padB); };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '"><line x1="0" x2="' + W + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="#2a2f37"/>';
  for (var i = 1; i <= n; i++){ var cx = padL + gw*(i-.5), v = perYr*i;
    s += '<rect x="' + (cx-bw/2) + '" y="' + y(v) + '" width="' + bw + '" height="' + (y(0)-y(v)) + '" rx="4" fill="' + (v >= flat ? '#ffc600' : 'rgba(255,198,0,.72)') + '" style="animation-delay:' + (i*60) + 'ms"><title>Year ' + i + ': ' + money(v) + '</title></rect>' +
      '<text x="' + cx + '" y="' + (y(v)-5) + '" text-anchor="middle" class="pill" fill="#e8ebee">' + money(v, 1) + '</text>' +
      '<text x="' + cx + '" y="' + (H-5) + '" text-anchor="middle" class="pill" fill="#8a939e">Yr ' + i + '</text>'; }
  s += '<line x1="' + padL + '" x2="' + (W-padR) + '" y1="' + y(flat) + '" y2="' + y(flat) + '" stroke="#5fe0a6" stroke-width="2" stroke-dasharray="6 4"/>' +
    '<text x="' + padL + '" y="' + (y(flat)-6) + '" class="pill" fill="#9be8c4">Value given up ' + money(flat, 1) + '</text></svg>';
  box.innerHTML = s;
}

/* ===================== NAV / BOOT ===================== */
var RENDER = { portfolio:renderPortfolio, companies:renderCompanies, whatif:renderWhatIf, settings:renderSettings };
function renderTab(t){ RENDER[t](); }
function renderAll(){ Object.keys(RENDER).forEach(renderTab); if (nav.detail) renderDetail(); }
function switchTab(t){
  if (nav.detail) closeDetail();
  if (t === nav.tab){ $('v-' + t).scrollTo({ top:0, behavior:'smooth' }); return; }
  nav.tab = t;
  document.querySelectorAll('.view.tab').forEach(function(v){ v.classList.toggle('active', v.id === 'v-' + t); });
  document.querySelectorAll('.tabbar [data-tab]').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === t); b.setAttribute('aria-selected', b.dataset.tab === t); });
  renderTab(t);
}
document.querySelector('.tabbar').addEventListener('click', function(e){ var b = e.target.closest('[data-tab]'); if (b) switchTab(b.dataset.tab); });
document.addEventListener('click', function(e){
  var o = e.target.closest('[data-open]'); if (o){ openDetail(o.dataset.open); return; }
  var g = e.target.closest('[data-go]'); if (g){ switchTab(g.dataset.go); return; }
  var r = e.target.closest('[data-range]');
  if (r){ var p = r.dataset.range.split(':'); r.parentNode.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b === r); });
    if (p[0] === 'p'){ ui.pRange = p[1]; drawPortfolioChart(); } else { ui.range = p[1]; drawDetailChart(); } saveUI(); }
});
window.addEventListener('popstate', function(){ if (nav.detail && !(history.state && history.state.detail)) closeDetail(true); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ if ($('sheet').classList.contains('on')) closeSheet(); else if (nav.detail) closeDetail(); } });
/* edge-swipe back on the detail view */
(function(){
  var d = $('detail'), sx = 0, sy = 0, on = false, dx = 0;
  d.addEventListener('touchstart', function(e){ var t = e.touches[0]; if (t.clientX > 28) return; on = true; sx = t.clientX; sy = t.clientY; dx = 0; }, { passive:true });
  d.addEventListener('touchmove', function(e){ if (!on) return; var t = e.touches[0]; dx = Math.max(0, t.clientX - sx); if (Math.abs(t.clientY - sy) > 40 && dx < 20){ on = false; return; }
    d.classList.add('dragging'); d.style.transform = 'translateX(' + dx + 'px)'; }, { passive:true });
  d.addEventListener('touchend', function(){ if (!on) return; on = false; d.classList.remove('dragging'); d.style.transform = ''; if (dx > window.innerWidth * .3) closeDetail(); });
})();
var rT; window.addEventListener('resize', function(){ clearTimeout(rT); rT = setTimeout(function(){ if (nav.tab === 'portfolio') drawPortfolioChart(); if (nav.detail){ if (nav.pane === 'summary'){ drawDetailChart(); drawHealth(byId(nav.detail)); } else renderPane(); positionInk(); } }, 150); });
window.addEventListener('storage', function(e){ if (e.key === STORE_KEY){ state = loadState(); renderAll(); } });
/* standalone single-file build: generate an inline manifest (hosted build ships manifest.webmanifest) */
(function(){
  var ml = $('manifestLink'); if (ml.getAttribute('href')) return;
  var start = location.href.split('#')[0], m = { name:'KNG Portfolio', short_name:'KNG', display:'standalone', orientation:'portrait', background_color:'#000000', theme_color:'#000000',
    icons:[{ src:$('appleIcon').getAttribute('href'), sizes:'180x180', type:'image/png' }] };
  if (/^https?:/.test(start)){ m.start_url = start; m.scope = start.replace(/[^/]*$/, ''); }
  ml.setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m)));
})();
renderAll();
if (location.hash && byId(location.hash.slice(1))) { try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} openDetail(location.hash.slice(1)); }

})();
</script>
