html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
/* ---------- views ---------- */
.view{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg);
  padding:calc(var(--safe-top) + 8px) 16px calc(var(--safe-bot) + 108px);
  transition:transform .42s var(--ease),opacity .3s ease,filter .42s var(--ease);will-change:transform}
.view.tab{opacity:0;pointer-events:none;transform:translateY(10px)}
.view.tab.active{opacity:1;pointer-events:auto;transform:none}
.view.tab.active.pushed{transform:translateX(-24%);filter:brightness(.55)}
#detail{z-index:10;padding:0 0 calc(var(--safe-bot) + 108px);transform:translateX(102%);box-shadow:-20px 0 40px rgba(0,0,0,.6)}
#detail.open{transform:none}
#detail.dragging{transition:none}
.wrap{max-width:560px;margin:0 auto}
/* ---------- top / brand ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;margin-bottom:6px}
.kngLogo{height:30px;width:auto;display:block}
.asof{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3}
.h-title{font-family:var(--head);font-size:26px;font-weight:700;letter-spacing:-.4px;margin:4px 0 14px}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.banner{display:flex;gap:10px;align-items:center;background:rgba(255,198,0,.09);border:1px solid rgba(255,198,0,.35);
  color:#ffe08a;border-radius:14px;padding:11px 12px;font-size:13.5px;line-height:1.35;margin:4px 0 14px}
.banner .tag{flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.6px;background:#ffc600;color:#111;border-radius:6px;padding:3px 6px}
.banner button{margin-left:auto;flex:0 0 auto;background:rgba(255,198,0,.16);border:0;color:#ffd24d;font-weight:700;border-radius:10px;min-height:36px;padding:0 12px}
/* ---------- hero ---------- */
.hero{font-family:var(--head);font-size:44px;font-weight:600;letter-spacing:-1.2px;line-height:1.08;margin:4px 0 2px}
.hero.neg{color:var(--red)}
.chg{font-size:16px;font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.chg .when{color:var(--muted);font-weight:500;font-size:14px}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}
.sub{font-size:13px;color:var(--muted);margin-top:6px}
/* ---------- chart ---------- */
.chart{position:relative;margin:14px -16px 0;height:210px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.chart .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s var(--ease) forwards}
.chart .fade{opacity:0;animation:fadeIn .7s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
.pill{font:600 11px var(--body);}
.tip{position:absolute;top:-2px;transform:translateX(-50%);background:#fff;color:#000;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.ranges{display:flex;align-items:center;gap:4px;background:#121418;border:1px solid var(--line);border-radius:999px;padding:4px;margin:10px 0 0}
.ranges button{flex:1;min-height:36px;border:0;background:transparent;border-radius:999px;color:#c9cfd6;font-weight:700;font-size:13px;transition:background .25s,color .25s}
.ranges button.on{background:var(--brand);color:var(--brand-ink,#111)}
.rangeNote{font-size:13px;color:var(--muted);margin:8px 2px 0;min-height:18px}
/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.cardHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.cardHead .label{font-size:12.5px}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.5px;color:#ffd24d;border:1px solid rgba(255,198,0,.45);border-radius:6px;padding:2px 6px}
.statsTwo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.tile .v{font-family:var(--head);font-size:21px;font-weight:600;margin-top:4px;letter-spacing:-.3px}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.goal .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.goal .pct{font-family:var(--head);font-size:20px;font-weight:600}
.bar{position:relative;height:10px;border-radius:999px;background:#23272e;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--kng2),var(--kng));width:0;transition:width .9s var(--ease)}
.bar.brand i{background:linear-gradient(90deg,var(--brand),var(--brand-l))}
.barLbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}
/* range bar (12-month low/high) */
.rbar{margin:2px 0 16px}
.rbar .lbls{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.rbar .lbls span:nth-child(2){color:var(--muted)}
.rbar .track{position:relative;height:6px;border-radius:9px;background:#2a2f37}
.rbar .mark{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,255,255,.12);transition:left .8s var(--ease)}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
.grid2 .cell{padding:11px 0;border-bottom:1px dashed #2a2f37}
.grid2 .k{font-size:14px;color:#c3c9d0}
.grid2 .v{font-size:16px;font-weight:700;margin-top:3px}
/* breakdown (the loved part) */
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}

.row.total{border-top:1px solid #3a4250}
.row.total .k{color:var(--text);font-weight:600} .row.total .v{font-size:18px}
.row.mine{background:rgba(34,196,126,.09);margin:6px -10px 0;padding:14px 10px;border-radius:12px;border-bottom:0}
.row.mine .k{color:var(--text);font-weight:600} .row.mine .v{color:var(--green);font-size:21px;font-family:var(--head)}
/* company cards */
.co{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;transition:transform .15s,background .2s;position:relative;overflow:hidden}
.co:active{transform:scale(.985);background:var(--card2)}
.co::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cb,#555)}
.co .r1{display:flex;align-items:center;gap:12px}
.logoTile{flex:0 0 auto;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logoTile img{max-width:100%;max-height:100%;display:block}
.co .logoTile{width:78px;height:46px;padding:5px 7px}
.co .nm{flex:1;min-width:0}
.co .nm b{display:block;font-family:var(--head);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co .nm > span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.co .val{text-align:right}
.co .val b{display:block;font-size:17px;font-weight:700}
.chip{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:700;border-radius:7px;padding:3px 7px;min-width:62px;text-align:center}
.chip.up{background:rgba(34,196,126,.15)} .chip.down{background:rgba(255,84,104,.15)} .chip.flat{background:#22262d}

.co .r2 .mine{font-size:12.5px;color:var(--muted)} .co .r2 .mine b{color:var(--text);font-weight:600}
.spark{display:block}
.smallTag{display:inline-block!important;font-size:10px;font-weight:800;color:#ffd24d;border:1px solid rgba(255,198,0,.4);border-radius:5px;padding:1px 4px;margin-left:6px;vertical-align:2px}
/* allocation */
.alloc{display:flex;height:14px;border-radius:999px;overflow:hidden;background:#23272e;gap:2px}
.alloc i{display:block;height:100%;transition:flex-grow .8s var(--ease)}
.legend{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.legend .li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}

/* list rows (companies tab) */
.lrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;text-align:left;min-height:64px}
.lrow:last-child{border-bottom:0}
.lrow .logoTile{width:54px;height:36px;padding:4px 5px;border-radius:9px}
.lrow .nm{flex:1;min-width:0} .lrow .nm b{display:block;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .lrow .nm > span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .val{text-align:right} .lrow .val b{display:block;font-weight:700}
.chev{color:var(--dim);font-size:20px;margin-left:2px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;border:0;font-size:16.5px;font-weight:700;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.kng{background:linear-gradient(90deg,var(--kng2),var(--kng));color:#111}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line2)}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(255,84,104,.45)}
.stack>*+*{margin-top:10px}
.circleBtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:rgba(30,33,38,.8);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.circleBtn svg{width:20px;height:20px}
.circleBtn:active{transform:scale(.94)}
/* detail */
.dtop{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.82);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);
  padding:calc(var(--safe-top) + 8px) 16px 0;border-bottom:1px solid #15181c}
.dtop .r{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px}
.dtitle{flex:1;text-align:center;min-width:0;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
.dtitle.on{opacity:1;transform:none}
.dtitle b{display:block;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtitle span{font-size:17px;font-weight:700}
.subtabs{display:flex;gap:26px;position:relative;margin-top:4px}
.subtabs button{background:none;border:0;padding:10px 0 12px;font-size:16px;font-weight:600;color:#d9dee4;transition:color .25s}
.subtabs button.on{color:var(--brand-l)}
.subtabs .ink{position:absolute;bottom:-1px;height:3px;border-radius:3px;background:var(--brand-l);transition:left .35s var(--ease),width .35s var(--ease)}
.dbody{padding:0 16px}
.brandHead{position:relative;margin:0 -16px;padding:18px 16px 4px;background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--brand) 38%,transparent),transparent 70%)}
.brandHead .r{display:flex;align-items:center;gap:14px}
.brandHead .logoTile{width:104px;height:58px;padding:7px 10px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.brandHead h1{font-family:var(--head);font-size:22px;font-weight:700;margin:0;letter-spacing:-.3px;line-height:1.15}
.brandHead .meta{font-size:12.5px;color:#c0c7cf;margin-top:3px}
.brandHead .meta a{color:var(--brand-l);text-decoration:none;font-weight:600}
.pane{animation:paneIn .38s var(--ease)}
.pane.fromRight{animation-name:paneInR} .pane.fromLeft{animation-name:paneInL}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes paneInR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes paneInL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.seg{display:inline-flex;background:#121418;border:1px solid var(--line2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:34px;padding:0 16px;font-weight:600;color:#c9cfd6;font-size:14px;transition:background .25s,color .25s}
.seg button.on{background:color-mix(in srgb,var(--brand) 70%,#000);color:#fff}
.bars svg{display:block;width:100%;overflow:visible}
.bars rect{transform-origin:bottom;transform-box:fill-box;animation:grow .7s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.lg{display:flex;gap:18px;font-size:14px;margin-top:10px;color:#d6dbe1}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table.q{width:100%;border-collapse:collapse;font-size:14.5px}
table.q th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;text-align:right;font-weight:600;padding:0 0 8px}
table.q th:first-child,table.q td:first-child{text-align:left}
table.q td{text-align:right;padding:10px 0;border-top:1px solid var(--line)}
.hist .hi{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist .hi:last-child{border-bottom:0}
.hist .d{color:var(--muted)} .hist .c{font-size:12.5px;margin-left:8px;font-weight:600}
.linkBtn{background:none;border:0;color:var(--brand-l);font-weight:600;font-size:14px;padding:8px 0;min-height:40px}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 2px}
.footnote{font-size:12px;color:var(--dim);text-align:center;line-height:1.5;margin:22px 10px 0}
/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-bot) + 12px);z-index:30;width:calc(100% - 24px);max-width:520px;
  display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(26,28,32,.72);border:1px solid rgba(255,255,255,.09);
  backdrop-filter:saturate(1.6) blur(22px);-webkit-backdrop-filter:saturate(1.6) blur(22px);box-shadow:0 10px 30px rgba(0,0,0,.5)}

.tabbar button.on{background:rgba(255,255,255,.08);color:var(--kng)}
/* sheets + modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:94vh;overflow-y:auto;background:#0d0f12;border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--line);
  transform:translateY(105%);transition:transform .42s var(--ease);padding:0 16px calc(var(--safe-bot) + 30px)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#3a3f47;margin:8px auto 0}

.sheetBody{max-width:560px;margin:0 auto}
.tbtn{min-height:44px;min-width:64px;padding:0 10px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:16px}
.tbtn.save{color:var(--kng);font-weight:700}
.field{margin-bottom:12px}
.field label{display:block;font-size:13.5px;color:var(--muted);margin:0 0 6px 2px;font-weight:600}
.inp{display:flex;align-items:center;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:0 14px;min-height:52px;transition:border-color .2s}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grp{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin:20px 2px 10px}
.qrow{display:grid;grid-template-columns:70px 1fr 1fr 36px;gap:8px;align-items:center;margin-bottom:8px}

textarea{width:100%;min-height:110px;background:var(--card);border:1px solid var(--line2);border-radius:14px;color:var(--text);padding:12px;font:12.5px ui-monospace,Menlo,monospace}
.modal{position:fixed;left:50%;top:50%;z-index:60;width:min(340px,calc(100% - 40px));background:#1a1d22;border:1px solid var(--line2);border-radius:20px;padding:20px;
  transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;transition:all .25s var(--ease)}
.modal.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.modal h3{margin:0 0 8px;font-size:18px} .modal p{margin:0 0 18px;color:#c3c9d0;font-size:14.5px;line-height:1.45}

.pickList .lrow .chev{font-size:22px}
.src{font-size:12px;color:var(--muted);line-height:1.6;word-break:break-all}
.src b{color:#cfd4da;font-weight:600}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ---------- What If ---------- */
.wiTag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.6px;color:#c9b6ff;background:rgba(150,120,255,.14);border:1px solid rgba(150,120,255,.45);border-radius:7px;padding:4px 8px}

.chipBtn{scroll-snap-align:start}
.chips::-webkit-scrollbar{display:none}

.lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 70% at 50% 0%,#1a1606 0%,#000 60%);padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left))}
.lockBox{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:stretch;text-align:center}
.lockLogo{height:44px;object-fit:contain;margin:0 auto 26px}
.lockTitle{font-family:var(--head);font-size:28px;font-weight:700;letter-spacing:-.4px;margin:0}
.lockSub{color:var(--muted);font-size:15px;margin:8px 0 26px}
.lockField input{box-sizing:border-box;width:100%;min-height:54px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:18px;padding:0 16px;outline:0;transition:border-color .2s}
.lockField input:focus{border-color:var(--kng)}
.lockStay{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px;margin:14px 0 4px}
.lockStay input{width:18px;height:18px;accent-color:var(--kng)}
.lockErr{min-height:22px;color:var(--red);font-size:14px;font-weight:600;margin:8px 0}
.lockBtn{min-height:54px;border:0;border-radius:14px;font:600 17px var(--head);color:#111;background:linear-gradient(90deg,var(--kng2),var(--kng));cursor:pointer}
.lockBtn:disabled{opacity:.6}
.lock.shake .lockField input{animation:lkShake .35s;border-color:var(--red)}
@keyframes lkShake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lock[hidden]{display:none}
.lockWho{display:flex;gap:8px;margin:0 0 14px}
.lockWho button{flex:1;min-height:56px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--text);font:600 16px var(--head);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.lockWho button small{font:500 11px var(--body);color:var(--muted)}
.lockWho button[aria-checked=true]{border-color:var(--kng);background:#211b05;color:var(--kng);box-shadow:0 0 0 1px var(--kng) inset}
.lockWho.need button{border-color:var(--red)}
.lockActs{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.lockGhost{min-height:54px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:#d9dee4;font:600 16px var(--head);cursor:pointer}
.lockGhost:hover{border-color:#4a515c}
.lockForget{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:13.5px;color:var(--muted)}
.lockLink{border:0;background:none;color:#ff8d9a;font-weight:700;font-size:13.5px;cursor:pointer;padding:6px 4px}
.lockForget[hidden]{display:none}
@media (min-width:768px){
  .lockBox{max-width:420px;background:rgba(12,13,16,.92);border:1px solid var(--line);border-radius:26px;padding:40px 36px 34px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .lockLogo{height:48px}
  .lockBtn:hover{filter:brightness(1.06)}
  .lockWho button:hover{border-color:#4a515c}
}

</style>
</head>

<script>
/* Per-user password gate.
   Build output holds: the app (markup + script) encrypted once with a random content key (AES-256-GCM), and for each
   person a PBKDF2-SHA256 salt, a verifier (SHA-256 of the second half of the PBKDF2 output) and the content key
   wrapped with the first half. Only that person's password unwraps their copy. No plaintext passwords anywhere. */
(function(){
'use strict';
var TK = 'kng.unlock.v2', LAST = 'kng.lastUser';
var P = JSON.parse(document.getElementById('kngPayload').textContent), C = window.crypto && window.crypto.subtle;
var $ = function(id){ return document.getElementById(id); };
var sel = null;
function b64(buf){ var s = '', a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
function unb64(s){ var r = atob(s), a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''); }
function enc(s){ return new TextEncoder().encode(s); }
function userById(id){ for (var i = 0; i < P.users.length; i++) if (P.users[i].id === id) return P.users[i]; return null; }
function store(){ try { return [sessionStorage, localStorage]; } catch(e){ return []; } }
function getTok(){ var t = null; store().forEach(function(s){ try { t = t || s.getItem(TK); } catch(e){} }); try { return t && JSON.parse(t); } catch(e){ return null; } }
function clearTok(){ store().forEach(function(s){ try { s.removeItem(TK); s.removeItem('kng.unlock.v1'); } catch(e){} }); }
function decryptApp(cek){
  return C.decrypt({ name:'AES-GCM', iv:unb64(P.iv) }, cek, unb64(P.ct)).then(function(b){ return JSON.parse(new TextDecoder().decode(b)); });
}
/* password -> (verifier ok?) -> content key, for one user only */
function unwrap(u, pw){
  return C.importKey('raw', enc(pw), 'PBKDF2', false, ['deriveBits']).then(function(base){
    return C.deriveBits({ name:'PBKDF2', salt:unb64(u.salt), iterations:P.iter, hash:'SHA-256' }, base, 512);

    var b = new Uint8Array(bits);
    return C.digest('SHA-256', b.slice(32)).then(function(v){
      if (hex(v) !== u.verifier) throw new Error('bad');
      return C.importKey('raw', b.slice(0, 32), 'AES-GCM', false, ['decrypt']);
    });

    return C.decrypt({ name:'AES-GCM', iv:unb64(u.wiv), additionalData:enc('kng-user:' + u.id) }, kek, unb64(u.wk));

function mount(u, app){

  lock.remove(); pay.remove();
  var s = document.createElement('script'); s.textContent = app.js; document.body.appendChild(s);
}
window.kngLock = function(){ clearTok(); location.reload(); };

function pick(id){
  sel = id; $('lockWho').classList.remove('need'); $('lock').classList.remove('shake'); $('lockErr').textContent = '';
  Array.prototype.forEach.call($('lockWho').children, function(b){ b.setAttribute('aria-checked', b.dataset.u === id ? 'true' : 'false'); });
  var u = userById(id); $('lockUser').value = u ? u.name : '';
  try { localStorage.setItem(LAST, id); } catch(e){}
  $('lockPw').focus();
}
function buildPicker(){
  $('lockWho').innerHTML = P.users.map(function(u){
    return '<button type="button" role="radio" aria-checked="false" data-u="' + u.id + '">' + u.name + (u.admin ? '<small>Admin</small>' : '') + '</button>';

  var last = null; try { last = localStorage.getItem(LAST); } catch(e){}

function fail(msg){

/* Clear: reset the form. Sign out (shown when this device remembers someone or holds a session): forget it. */
function forgetRow(){
  var last = null, t = getTok(); try { last = localStorage.getItem(LAST); } catch(e){}

  sel = null; $('lockPw').value = ''; $('lockStay').checked = false; $('lockErr').textContent = ''; $('lockUser').value = '';
  $('lock').classList.remove('shake'); $('lockWho').classList.remove('need');
  Array.prototype.forEach.call($('lockWho').children, function(b){ b.setAttribute('aria-checked', 'false'); });
  $('lockBtn').disabled = false; $('lockBtn').textContent = 'Unlock';
}
$('lockClear').addEventListener('click', function(){ clearForm(); if ($('lockWho').firstChild) $('lockWho').firstChild.focus(); });
$('lockForget').addEventListener('click', function(){ clearTok(); try { localStorage.removeItem(LAST); } catch(e){} clearForm(); forgetRow(); $('lockSub').textContent = 'Signed out. Choose your name and enter your password.'; });
if (!C){ $('lockErr').textContent = 'This browser cannot unlock the app (needs HTTPS and a modern browser).'; $('lockBtn').disabled = true; return; }
$('lockForm').addEventListener('submit', function(e){
  e.preventDefault();
  var u = userById(sel), pw = $('lockPw').value, stay = $('lockStay').checked;
  if (!u){ $('lockWho').classList.add('need'); fail('Choose your name first.'); return; }
  if (!pw){ fail('Enter your password.'); return; }
  $('lockBtn').disabled = true; $('lockBtn').textContent = 'Unlocking…'; $('lockErr').textContent = '';
  unwrap(u, pw).then(function(raw){
    return C.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(decryptApp).then(function(app){
      clearTok();
      try { (stay ? localStorage : sessionStorage).setItem(TK, JSON.stringify({ b:P.id, u:u.id, k:b64(raw) })); } catch(e){}
      $('lockPw').value = ''; mount(u, app);
    });
  }).catch(function(){ fail('Name and password don’t match. Please try again.'); });
});
/* already unlocked in this session (or "stay signed in") */
var t = getTok(), tu = t && t.b === P.id && userById(t.u);
if (tu){
  $('lock').hidden = true;
  C.importKey('raw', unb64(t.k), 'AES-GCM', false, ['decrypt']).then(decryptApp).then(function(app){ mount(tu, app); })
    .catch(function(){ clearTok(); showLock(); });
} else { clearTok(); showLock(); }
})();

</script>
